name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Setup Java 17 for Backend Build
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Backend with Maven
      run: |
        cd backend
        mvn clean package -DskipTests

    # # 2. Setup Node.js for Frontend Build
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build Frontend with Vite
      run: |
        cd frontend
        npm install
        npm run build

    # 3. Test Docker Build Integration
    - name: Test Docker Compose Build
      run: |
        docker compose build