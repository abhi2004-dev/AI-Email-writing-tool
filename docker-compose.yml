version: '3.8'

services:
  backend:
    build: ./backend
    container_name: email-writer-backend
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  frontend:
    build: ./frontend
    container_name: email-writer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"  # Note: Adjust frontend port or grafana port if there's a port clash, e.g., map Grafana to 3001:3000
    restart: always