server.port=8080
spring.application.name=email-writer

# Gemini AI Configuration (Injected via Environment Variable)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
# Expose actuator endpoints for Prometheus monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true