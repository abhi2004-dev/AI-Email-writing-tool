---
- name: Configure EC2 Instance for AI-Email-writing-tool
  hosts: webservers
  become: true # This tells Ansible to run commands as root (sudo)

  tasks:
    - name: Update all packages to their latest version
      ansible.builtin.dnf:
        name: '*'
        state: latest

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Start and enable the Nginx service
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start and enable the Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to the docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true